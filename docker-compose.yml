name: editeur-tp7

x-logging: &logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"

x-app: &app
  build: .
  logging: *logging
  environment: &environment
    PORT: "3000"
    NODE_ENV: development
    AUTH_MODE: demo
    JWT_SECRET: ${JWT_SECRET:?Lancer npm run setup:demo avant docker compose up}
    REDIS_URL: redis://redis:6379
    REDIS_NAMESPACE: editeur-tp7
    PUBLIC_ORIGINS: http://localhost:3010,http://127.0.0.1:3010,http://localhost:3101,http://127.0.0.1:3101,http://localhost:3102,http://127.0.0.1:3102
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 15
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 512m
  cpus: 1.0

services:
  redis:
    image: redis:7-alpine
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app-a:
    <<: *app
    environment:
      <<: *environment
      INSTANCE: A
    ports:
      - "127.0.0.1:3101:3000"

  app-b:
    <<: *app
    environment:
      <<: *environment
      INSTANCE: B
    ports:
      - "127.0.0.1:3102:3000"

  proxy:
    image: nginx:alpine
    logging: *logging
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy

volumes:
  redis-data:

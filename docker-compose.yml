name: editeur-tp7

x-app: &app
  build: .
  environment: &environment
    PORT: "3000"
    REDIS_URL: redis://redis:6379
    REDIS_NAMESPACE: editeur-tp7
    PUBLIC_ORIGINS: http://localhost:3010,http://127.0.0.1:3010,http://localhost:3101,http://127.0.0.1:3101,http://localhost:3102,http://127.0.0.1:3102
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 15

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app-a:
    <<: *app
    environment:
      <<: *environment
      INSTANCE: A
    ports:
      - "127.0.0.1:3101:3000"

  app-b:
    <<: *app
    environment:
      <<: *environment
      INSTANCE: B
    ports:
      - "127.0.0.1:3102:3000"

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy

volumes:
  redis-data:

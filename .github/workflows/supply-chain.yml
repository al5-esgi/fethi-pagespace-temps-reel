name: supply-chain
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  security-events: write
jobs:
  deps-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: npm audit - rapport JSON
        run: |
          mkdir -p .security-reports
          set +e
          npm audit --json > .security-reports/npm-audit.json
          status=$?
          test "$status" -le 1
      - name: OSV - meme fichier de verrouillage
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.6.0 \
            scan source --lockfile=package-lock.json --format=json --output-file=.security-reports/osv.json
          status=$?
          test "$status" -le 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-reports
          path: .security-reports/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Seuil npm - zero HIGH ou CRITICAL
        if: always()
        run: node scripts/security/gate.mjs npm .security-reports/npm-audit.json
      - name: Seuil OSV - CVSS 7 ou plus, severite inconnue bloquante
        if: always()
        run: node scripts/security/gate.mjs osv .security-reports/osv.json
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: SBOM CycloneDX des dependances de production
        run: npm sbom --sbom-format=cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire et exporter l'image durcie depuis les sources
        run: docker build -t pagespace:security . && docker save pagespace:security -o /tmp/pagespace.tar
      - name: Trivy - scanner l'archive sans acces au service Docker
        run: |
          mkdir -p .security-reports
          docker run --rm -v /tmp/pagespace.tar:/scan/image.tar:ro -v "$PWD/.security-reports:/reports" \
            aquasec/trivy:0.75.0 image --input=/scan/image.tar --scanners=vuln \
              --format=json --output=/reports/trivy.json --exit-code=0
          docker run --rm -v "$PWD/.security-reports:/reports" aquasec/trivy:0.75.0 \
            convert --format=sarif --output=/reports/trivy.sarif /reports/trivy.json
      - name: Publier les findings dans Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .security-reports/trivy.sarif
          category: pagespace-trivy-image
      - name: Seuil image - zero HIGH ou CRITICAL
        if: always()
        run: node scripts/security/gate.mjs image .security-reports/trivy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-image
          path: .security-reports/trivy.*
          if-no-files-found: error
          retention-days: 7

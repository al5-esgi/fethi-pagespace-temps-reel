name: sast
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  security-events: write
concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep - rapport SARIF sans decision implicite
        run: |
          mkdir -p .security-reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0 \
            semgrep scan --config=p/ci --config=.semgrep --metrics=off \
              --sarif --output=.security-reports/semgrep.sarif src scripts
      - name: Publier les findings dans Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .security-reports/semgrep.sarif
          category: pagespace-semgrep
      - name: Seuil SAST - zero ERROR
        if: always()
        run: node scripts/security/gate.mjs sast .security-reports/semgrep.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-sarif
          path: .security-reports/semgrep.sarif
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  secret-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks - historique de la branche, valeurs masquees
        run: |
          mkdir -p .security-reports
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="HEAD" --config=.gitleaks.toml --redact --exit-code=0 \
              --report-format=json --report-path=.security-reports/gitleaks.json .
          node scripts/security/gitleaks-sarif.mjs .security-reports/gitleaks.json .security-reports/gitleaks.sarif
      - name: Publier les findings dans Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: .security-reports/gitleaks.sarif
          category: pagespace-gitleaks
      - name: Seuil secrets - zero secret non qualifie
        if: always()
        run: node scripts/security/gate.mjs secrets .security-reports/gitleaks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-redacted
          path: .security-reports/gitleaks.*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

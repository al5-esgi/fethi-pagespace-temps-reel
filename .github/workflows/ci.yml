name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run typecheck
      - name: Verification des droits REST, SSE, JWT et WebSocket
        run: npm run test:security
      - name: Presence, reconnexion et convergence de deux clients
        run: npm run test:tp5 && npm run test:tp6 && npm run scenario
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run setup:demo
      - name: Demarrage du cluster local durci
        run: docker compose up --build -d --wait
      - name: Fan-out, convergence, SSE et reconnexion entre A et B
        run: npm run test:tp7
      - name: Diagnostic du cluster
        if: failure()
        run: docker compose logs --tail=100
      - name: Arret du cluster ephemere
        if: always()
        run: docker compose down -v

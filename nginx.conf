# Proxy sticky pour l'etape 7 (2 instances). Utilise par le service `proxy` du docker-compose.yml.
upstream realtime {
  ip_hash;                 # sticky sessions : un client garde la meme instance
  server app-a:3000;
  server app-b:3000;
}

server {
  listen 3000;
  location / {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
